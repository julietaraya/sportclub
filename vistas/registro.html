<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - SportClub</title>
    <link rel="icon" type="image/png" href="../assets/img/icon2.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="auth-page">
    <div class="auth-card auth-card-wide">
        <h1 class="h3 text-center mb-4">Crear cuenta</h1>
        <form id="formRegister" novalidate>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="full_name" class="form-label">Nombre completo *</label>
                    <input type="text" class="form-control" id="full_name" required>
                    <div class="invalid-feedback" id="errorFull_name"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email *</label>
                    <input type="email" class="form-control" id="email" required>
                    <div class="invalid-feedback" id="errorEmail"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label">Contraseña *</label>
                    <input type="password" class="form-control" id="password" required>
                    <div class="invalid-feedback" id="errorPassword"></div>
                    <small class="text-muted">Mínimo 8 caracteres</small>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="password2" class="form-label">Confirmar contraseña *</label>
                    <input type="password" class="form-control" id="password2" required>
                    <div class="invalid-feedback" id="errorPassword2"></div>
                </div>
            </div>
            <div id="alertaGeneral" class="alert alert-danger d-none" role="alert"></div>
            <div id="alertaExito" class="alert alert-success d-none" role="alert"></div>
            <button type="submit" class="btn btn-primary w-100 mb-3">
                <i class="bi bi-person-plus"></i> Registrarme
            </button>
            <div class="text-center">
                <a href="./login.html" class="link-primary">
                    ¿Ya tienes cuenta? Inicia sesión
                </a>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
