<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SportClub</title>
    <link rel="icon" type="image/png" href="../assets/img/icon2.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="text-center mb-4">
            <img src="../assets/img/logo_empresa_letra_v1.png" alt="Logo SportClub" class="auth-logo">
        </div>
        <h1 class="h3 text-center mb-4">Iniciar Sesión</h1>
        <form id="formLogin" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="tucorreo@demo.cl" required>
                <div class="invalid-feedback" id="errorEmail"></div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña" required>
                <div class="invalid-feedback" id="errorPassword"></div>
            </div>
            <div id="alertaGeneral" class="alert alert-danger d-none" role="alert"></div>
            <button type="submit" class="btn btn-primary w-100 mb-3">
                <i class="bi bi-box-arrow-in-right"></i> Ingresar
            </button>
            <div class="text-center">
                <a href="../index.html" class="link-secondary me-3">
                    <i class="bi bi-arrow-left"></i> Inicio
                </a>
                <a href="./registro.html" class="link-primary">
                    ¿No tienes cuenta? Regístrate
                </a>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
